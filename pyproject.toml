[project]
name = "intent-classifier"
version = "0.1.0"
description = "Fine-tuned customer support intent classifier with FastAPI inference."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]
train = [
    "accelerate>=0.31.0",
    "datasets>=2.20.0",
    "evaluate>=0.4.2",
    "huggingface-hub>=0.23.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.16.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

